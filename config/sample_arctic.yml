data:
  refine_text_path: text/text_arctic

# model settings
model:
  input_dim: 99
  obj_input_dim: 10
  hand_shape_dim: 10
  obj_embed_dim: 1028
  latent_dim: 512
  ff_size: 2048
  num_layers: 8
  num_heads: 4
  num_experts: 3
  num_experts_per_tok: 1
  # num_shared_experts: 1
  dropout: 0.1
  activation: "gelu"
  use_group: True
  return_topk_idx: False


  