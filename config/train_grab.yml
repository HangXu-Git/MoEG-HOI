data:
  refine_text_path: text/text_grab

# model settings
model:
  input_dim: 99
  obj_input_dim: 9
  hand_shape_dim: 10
  obj_embed_dim: 1028
  latent_dim: 512
  ff_size: 2048
  num_layers: 8
  num_heads: 4
  num_experts: 3
  num_experts_per_tok: 1
  # num_shared_experts: 1
  dropout: 0.1
  activation: "gelu"
  use_group: True
  return_topk_idx: False

# train settings
train:
  batch_size: 32
  num_epoch: 200
  loss:
    vpe_path: asset/grabnet/verts_per_edge.npy
    c_weight_path: asset/grabnet/rhand_weight.npy
    loss_type: jvhoepcs

  # reload_ckpt_model_filepath: 
  # reload_ckpt_optimizer_filepath: 
test:
  test_freq: -1

# optimizer settings
runtime:
  device_id: [2]
exp_id: "main_grab"
# exp_id: "debug"